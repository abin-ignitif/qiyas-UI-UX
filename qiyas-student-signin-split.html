<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qiyas · Student Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #0D662C;
      --green-strong: #09481F;
      --green-soft: #E6F2EA;
      --gold: #CE940F;
      --ink: #11120F;
      --paper: #FEFEFE;

      --bg-right: #F7F7F4;
      --card-bg: #FFFFFF;
      --card-border: #E6E7E2;
      --field-bg: #FFFFFF;
      --field-border: #D8DAD3;
      --topctl-bg: #FFFFFF;
      --topctl-border: #E2E3DE;

      --text: #11120F;
      --text-2: #565B52;
      --text-3: #878C82;

      --btn-bg: #11120F;
      --btn-bg-hover: #000000;
      --btn-fg: #FEFEFE;
      --focus: #1A8C43;

      --radius-card: 16px;
      --radius-field: 9px;
      --radius-ctl: 12px;

      --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-arabic: "IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, sans-serif;

      --logo-ink: #11120F;
      --logo-green: #0D662C;
      --logo-gold: #CE940F;
    }
    html[data-theme="dark"] {
      --bg-right: #11120F;
      --card-bg: #181A16;
      --card-border: #2A2E28;
      --field-bg: #11120F;
      --field-border: #333830;
      --topctl-bg: #1B1E19;
      --topctl-border: #2E332C;

      --text: #FEFEFE;
      --text-2: #C4C7C0;
      --text-3: #9AA096;

      --btn-bg: #FEFEFE;
      --btn-bg-hover: #E1E3DF;
      --btn-fg: #11120F;
      --focus: #66B385;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    html { background: var(--bg-right); }
    body {
      margin: 0;
      color: var(--text);
      background: var(--bg-right);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    html[dir="rtl"] body { font-family: var(--font-arabic); }
    h1, p { margin: 0; }
    a { color: inherit; }
    button { font: inherit; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }

    .auth { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 100dvh; }

    /* — Left · branding over the classroom image — */
    .brand-panel {
      position: relative;
      display: grid;
      place-items: center;
      padding: 48px;
      overflow: hidden;
      background: var(--green-strong) url("assets/classroom.jpg") center / cover no-repeat;
    }
    .brand-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, rgba(4, 35, 15, .50), rgba(9, 72, 31, .55));
    }
    .brand-card {
      position: relative;
      z-index: 1;
      inline-size: 100%;
      max-inline-size: 420px;
      padding: 46px 42px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, .40);
      border-radius: 20px;
      background: rgba(255, 255, 255, .30);
      backdrop-filter: blur(16px) saturate(120%);
      -webkit-backdrop-filter: blur(16px) saturate(120%);
      box-shadow: 0 18px 44px rgba(0, 0, 0, .16);
      color: #11120F;
      --logo-ink: #11120F;
      --logo-green: #0D662C;
      --logo-gold: #CE940F;
    }
    .brand-logo { display: block; margin-inline: auto; height: auto; }
    .brand-logo.en { width: 224px; }
    .brand-logo.ar { width: 250px; }
    .brand-tagline { margin-block-start: 18px; font-size: 24px; font-weight: 500; letter-spacing: -.01em; color: #11120F; }
    .brand-tagline-ar { margin-block-start: 14px; font-size: 22px; font-weight: 500; color: #11120F; font-family: var(--font-arabic); }
    .brand-divider { margin: 30px auto; width: 76%; height: 1px; background: rgba(17, 18, 15, .22); }

    /* — Right · sign in — */
    .form-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-inline-size: 0;
      padding: 80px 32px 48px;
      background: var(--bg-right);
    }
    .top-controls {
      position: absolute;
      inset-block-start: 24px;
      inset-inline-end: 24px;
      display: flex;
      gap: 10px;
    }
    .ctl {
      display: grid;
      place-items: center;
      inline-size: 46px;
      block-size: 46px;
      padding: 0;
      border: 1px solid var(--topctl-border);
      border-radius: var(--radius-ctl);
      background: var(--topctl-bg);
      color: var(--text-2);
      transition: color .15s ease, border-color .15s ease, background-color .15s ease;
    }
    .ctl:hover { color: var(--text); border-color: var(--text-3); }
    .ctl svg { inline-size: 20px; block-size: 20px; }
    .ctl .ico-sun { display: none; }
    html[data-theme="dark"] .ctl .ico-moon { display: none; }
    html[data-theme="dark"] .ctl .ico-sun { display: block; }
    .ctl.lang { font-family: var(--font-arabic); font-size: 15px; font-weight: 700; letter-spacing: .02em; }

    .mobile-brand { display: none; }

    .signin-card {
      inline-size: 100%;
      max-inline-size: 440px;
      padding: 40px;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-card);
      background: var(--card-bg);
      box-shadow: 0 14px 38px rgba(17, 18, 15, .07);
    }
    .eyebrow {
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    html[dir="rtl"] .eyebrow { letter-spacing: 0; }
    .signin-card h1 { margin-block-start: 10px; font-size: clamp(30px, 2.6vw, 36px); font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
    .helper { margin-block-start: 10px; color: var(--text-2); font-size: 15px; }

    .field { margin-block-start: 22px; }
    .field label { display: block; margin-block-end: 8px; font-size: 14px; font-weight: 600; color: var(--text); }
    .input {
      inline-size: 100%;
      min-block-size: 48px;
      padding: 12px 14px;
      border: 1px solid var(--field-border);
      border-radius: var(--radius-field);
      background: var(--field-bg);
      color: var(--text);
      font-size: 15px;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .input::placeholder { color: var(--text-3); }
    .input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 18%, transparent); }
    input[dir="ltr"], input.input[dir="ltr"] { text-align: start; }

    .pw-wrap { position: relative; direction: ltr; }
    .pw-wrap .input { padding-inline-end: 52px; }
    .pw-toggle {
      position: absolute;
      inset-block-start: 50%;
      inset-inline-end: 5px;
      transform: translateY(-50%);
      display: grid;
      place-items: center;
      inline-size: 40px;
      block-size: 40px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text-3);
    }
    .pw-toggle:hover { color: var(--text); background: var(--green-soft); }
    html[data-theme="dark"] .pw-toggle:hover { background: rgba(102, 179, 133, .14); }
    .pw-toggle svg { inline-size: 20px; block-size: 20px; }
    .pw-toggle .ico-eye-off { display: none; }
    .pw-toggle.is-visible .ico-eye { display: none; }
    .pw-toggle.is-visible .ico-eye-off { display: block; }

    .check { display: flex; align-items: center; gap: 10px; margin-block-start: 20px; font-size: 14px; color: var(--text); cursor: pointer; }
    .check input { inline-size: 18px; block-size: 18px; accent-color: var(--green); cursor: pointer; }

    .btn-primary {
      inline-size: 100%;
      min-block-size: 50px;
      margin-block-start: 24px;
      border: 1px solid var(--btn-bg);
      border-radius: var(--radius-field);
      background: var(--btn-bg);
      color: var(--btn-fg);
      font-size: 16px;
      font-weight: 700;
      transition: background-color .15s ease, border-color .15s ease, transform .15s ease;
    }
    .btn-primary:hover { background: var(--btn-bg-hover); border-color: var(--btn-bg-hover); }
    .btn-primary:active { transform: translateY(1px); }

    .switch { margin-block-start: 22px; text-align: center; color: var(--text-2); font-size: 14px; }
    .switch a { color: var(--green); font-weight: 700; text-decoration: none; }
    .switch a:hover { text-decoration: underline; }

    @media (max-width: 900px) {
      .auth { grid-template-columns: minmax(0, 1fr); }
      .brand-panel { display: none; }
      .form-panel { justify-content: flex-start; padding: 84px 20px 40px; }
      .mobile-brand {
        display: flex;
        align-items: center;
        justify-content: center;
        inline-size: 100%;
        margin-block-end: 24px;
      }
      .mobile-brand .brand-logo.en { width: 150px; }
      .mobile-brand .brand-logo.ar { width: 168px; }
      .mobile-brand .logo-ar { display: none; }
      html[dir="rtl"] .mobile-brand .logo-en { display: none; }
      html[dir="rtl"] .mobile-brand .logo-ar { display: block; }
      .signin-card { padding: 30px 24px; }
    }
    @media (max-width: 380px) {
      .signin-card { padding: 26px 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>

  <svg aria-hidden="true" width="0" height="0" style="position:absolute;overflow:hidden">
    <symbol id="qiyas-logo-en" viewBox="0 0 1201 349"><path d="M 343.0 96.0 L 343.0 293.0 L 377.0 293.0 L 377.0 96.0 Z M 1014.0 93.0 L 1013.0 205.0 L 1146.0 206.0 L 1147.0 262.0 L 1014.0 263.0 L 1013.0 294.0 L 1180.0 294.0 L 1179.0 175.0 L 1046.0 174.0 L 1047.0 124.0 L 1180.0 124.0 L 1180.0 94.0 Z M 751.0 93.0 L 751.0 294.0 L 784.0 293.0 L 785.0 205.0 L 896.0 205.0 L 897.0 294.0 L 930.0 294.0 L 930.0 93.0 Z M 783.0 125.0 L 896.0 124.0 L 897.0 174.0 L 785.0 174.0 Z M 471.0 91.0 L 471.0 204.0 L 552.0 204.0 L 554.0 206.0 L 554.0 298.0 L 589.0 298.0 L 589.0 205.0 L 671.0 204.0 L 671.0 92.0 L 637.0 92.0 L 636.0 174.0 L 506.0 174.0 L 505.0 92.0 Z" fill="var(--logo-ink)" fill-rule="evenodd" clip-rule="evenodd"/><path d="M 21.0 88.0 L 21.0 293.0 L 195.0 293.0 L 230.0 328.0 L 250.0 309.0 L 244.0 299.0 L 143.0 192.0 L 138.0 193.0 L 121.0 212.0 L 164.0 261.0 L 54.0 262.0 L 52.0 258.0 L 54.0 121.0 L 209.0 120.0 L 211.0 122.0 L 211.0 244.0 L 242.0 276.0 L 242.0 89.0 Z" fill="var(--logo-green)" fill-rule="evenodd" clip-rule="evenodd"/><path d="M 341.0 74.0 L 343.0 76.0 L 379.0 76.0 L 360.0 44.0 Z M 145.0 20.0 L 145.0 51.0 L 176.0 52.0 L 176.0 21.0 Z M 80.0 20.0 L 78.0 41.0 L 80.0 52.0 L 109.0 52.0 L 110.0 20.0 Z" fill="var(--logo-gold)" fill-rule="evenodd" clip-rule="evenodd"/></symbol>

  </svg>

  <main class="auth">
    <aside class="brand-panel" aria-label="Qiyas">
      <div class="brand-card">
        <svg class="brand-logo en" viewBox="0 0 1201 349" role="img" aria-label="Qiyas"><use href="#qiyas-logo-en"></use></svg>
        <p class="brand-tagline" data-en="Measure what matters" data-ar="Measure what matters">Measure what matters</p>
        <div class="brand-divider" aria-hidden="true"></div>
        <svg class="brand-logo ar" viewBox="0 0 1202 299" role="img" aria-label="قياس"><use href="#qiyas-logo-ar"></use></svg>
        <p class="brand-tagline-ar" data-en="قياس ما يهمّ" data-ar="قياس ما يهمّ">قياس ما يهمّ</p>
      </div>
    </aside>

    <section class="form-panel">
      <div class="top-controls">
        <button class="ctl" id="themeToggle" type="button" aria-label="Toggle dark mode">
          <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
          <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="ctl lang" id="langToggle" type="button" aria-label="Switch language"><span id="langLabel">عر</span></button>
      </div>

      <div class="mobile-brand" aria-hidden="true">
        <svg class="brand-logo en logo-en" viewBox="0 0 1201 349" role="img" aria-label="Qiyas"><use href="#qiyas-logo-en"></use></svg>
        <svg class="brand-logo ar logo-ar" viewBox="0 0 1202 299" role="img" aria-label="قياس"><use href="#qiyas-logo-ar"></use></svg>
      </div>

      <div class="signin-card">
        <p class="eyebrow" data-en="Student account" data-ar="حساب الطالب">Student account</p>
        <h1 data-en="Sign in" data-ar="تسجيل الدخول">Sign in</h1>
        <!-- <p class="helper" data-en="Use your email and password to reach your work." data-ar="استخدم بريدك الإلكتروني وكلمة المرور للوصول إلى عملك.">Use your email and password to reach your work.</p> -->

        <form id="signinForm" novalidate>
          <div class="field">
            <label for="email" data-en="Email address or Student ID" data-ar="البريد الإلكتروني أو رقم الطالب">Email address or Student ID</label>
            <input class="input" id="email" name="email" type="text" dir="ltr" autocomplete="username" inputmode="email" autocapitalize="none" autocorrect="off" placeholder="samira@example.com">
          </div>

          <div class="field">
            <label for="password" data-en="Password" data-ar="كلمة المرور">Password</label>
            <div class="pw-wrap">
              <input class="input" id="password" name="password" type="password" dir="ltr" autocomplete="current-password" placeholder="••••••••">
              <button class="pw-toggle" id="pwToggle" type="button" aria-label="Show password" aria-pressed="false">
                <svg class="ico-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 6 12 6s9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.4"/></svg>
                <svg class="ico-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4l16 16"/><path d="M9.5 9.6A2.4 2.4 0 0 0 12 14.4c.7 0 1.3-.3 1.8-.8"/><path d="M6.2 6.4C3.9 8 2.5 12 2.5 12S6 18 12 18c1.6 0 3-.4 4.2-1.1"/><path d="M10.1 6.2A9.6 9.6 0 0 1 12 6c6 0 9.5 6 9.5 6s-.8 1.4-2.3 2.8"/></svg>
              </button>
            </div>
          </div>

          <label class="check" for="keep">
            <input id="keep" name="keep" type="checkbox">
            <span data-en="Keep me signed in on this device" data-ar="أبقني مسجّلاً للدخول على هذا الجهاز">Keep me signed in on this device</span>
          </label>

          <button class="btn-primary" type="submit" data-en="Sign in" data-ar="تسجيل الدخول">Sign in</button>
        </form>

        <p class="switch">
          <span data-en="Not the student?" data-ar="لست الطالب؟">Not the student?</span>
          <a href="qiyas-role-picker.html" data-en="Switch account" data-ar="تبديل الحساب">Switch account</a>
        </p>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var root = document.documentElement;
      var locale = localStorage.getItem('qiyas-signin-locale') || 'en';
      var theme = localStorage.getItem('qiyas-signin-theme') || 'light';

      function applyLocale() {
        var en = locale === 'en';
        root.lang = en ? 'en' : 'ar';
        root.dir = en ? 'ltr' : 'rtl';
        document.querySelectorAll('[data-en][data-ar]').forEach(function (el) {
          el.textContent = en ? el.getAttribute('data-en') : el.getAttribute('data-ar');
        });
        var label = document.getElementById('langLabel');
        label.textContent = en ? 'عر' : 'EN';
        var langBtn = document.getElementById('langToggle');
        langBtn.setAttribute('aria-label', en ? 'التبديل إلى العربية' : 'Switch to English');
        localStorage.setItem('qiyas-signin-locale', locale);
      }

      function applyTheme() {
        root.dataset.theme = theme;
        document.getElementById('themeToggle').setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
        localStorage.setItem('qiyas-signin-theme', theme);
      }

      document.getElementById('themeToggle').addEventListener('click', function () {
        theme = theme === 'dark' ? 'light' : 'dark';
        applyTheme();
      });

      document.getElementById('langToggle').addEventListener('click', function () {
        locale = locale === 'en' ? 'ar' : 'en';
        applyLocale();
      });

      var pwToggle = document.getElementById('pwToggle');
      var pw = document.getElementById('password');
      pwToggle.addEventListener('click', function () {
        var show = pw.type === 'password';
        pw.type = show ? 'text' : 'password';
        pwToggle.classList.toggle('is-visible', show);
        pwToggle.setAttribute('aria-pressed', String(show));
        pwToggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      });

      document.getElementById('signinForm').addEventListener('submit', function (event) {
        event.preventDefault();
      });

      applyTheme();
      applyLocale();
    }());
  </script>
</body>
</html>
