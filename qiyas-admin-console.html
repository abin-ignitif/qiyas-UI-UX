function downloadBlob(blob,filename){
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=url; link.download=filename;
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function xlsxCrc32(bytes){
  let crc=0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++){
    crc^=bytes[i];
    for(let k=0;k<8;k++) crc=(crc>>>1)^(0xEDB88320&-(crc&1));
  }
  return (crc^0xFFFFFFFF)>>>0;
}
function xlsxZip(files){
  const encoder=new TextEncoder();
  const chunks=[]; const central=[]; let offset=0;
  files.forEach(file=>{
    const nameBytes=encoder.encode(file.name);
    const data=file.data;
    const crc=xlsxCrc32(data);
    const local=new Uint8Array(30+nameBytes.length);
    const lv=new DataView(local.buffer);
    lv.setUint32(0,0x04034b50,true);
    lv.setUint16(4,20,true);
    lv.setUint16(6,0,true);
    lv.setUint16(8,0,true);
    lv.setUint16(10,0,true);
    lv.setUint16(12,0,true);
    lv.setUint32(14,crc,true);
    lv.setUint32(18,data.length,true);
    lv.setUint32(22,data.length,true);
    lv.setUint16(26,nameBytes.length,true);
    lv.setUint16(28,0,true);
    local.set(nameBytes,30);
    chunks.push(local,data);
    const cd=new Uint8Array(46+nameBytes.length);
    const cv=new DataView(cd.buffer);
    cv.setUint32(0,0x02014b50,true);
    cv.setUint16(4,20,true);
    cv.setUint16(6,20,true);
    cv.setUint16(8,0,true);
    cv.setUint16(10,0,true);
    cv.setUint16(12,0,true);
    cv.setUint16(14,0,true);
    cv.setUint32(16,crc,true);
    cv.setUint32(20,data.length,true);
    cv.setUint32(24,data.length,true);
    cv.setUint16(28,nameBytes.length,true);
    cv.setUint16(30,0,true);
    cv.setUint16(32,0,true);
    cv.setUint16(34,0,true);
    cv.setUint16(36,0,true);
    cv.setUint32(38,0,true);
    cv.setUint32(42,offset,true);
    cd.set(nameBytes,46);
    central.push(cd);
    offset+=local.length+data.length;
  });
  const centralSize=central.reduce((sum,part)=>sum+part.length,0);
  const end=new Uint8Array(22);
  const ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true);
  ev.setUint16(8,central.length,true);
  ev.setUint16(10,central.length,true);
  ev.setUint32(12,centralSize,true);
  ev.setUint32(16,offset,true);
  const parts=chunks.concat(central,[end]);
  const total=parts.reduce((sum,part)=>sum+part.length,0);
  const out=new Uint8Array(total); let pos=0;
  parts.forEach(part=>{ out.set(part,pos); pos+=part.length; });
  return out;
}
function xlsxXmlEscape(value){ return String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c])); }
function xlsxColLetter(index){ let out=''; let n=index; while(n>0){ const m=(n-1)%26; out=String.fromCharCode(65+m)+out; n=Math.floor((n-1)/26); } return out; }
function xlsxSheetXml(rows){
  let body='';
  rows.forEach((row,r)=>{
    let cells='';
    (row||[]).forEach((value,c)=>{
      const ref=xlsxColLetter(c+1)+(r+1);
      if(typeof value==='number'&&isFinite(value)) cells+='<c r="'+ref+'"><v>'+value+'</v></c>';
      else cells+='<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xlsxXmlEscape(value)+'</t></is></c>';
    });
    body+='<row r="'+(r+1)+'">'+cells+'</row>';
  });
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+body+'</sheetData></worksheet>';
}
function buildLocalXlsx(rows,sheetName){
  const encoder=new TextEncoder();
  const name=sheetName||'Sheet1';
  const files=[
    {name:'[Content_Types].xml',data:encoder.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>')},
    {name:'_rels/.rels',data:encoder.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>')},
    {name:'xl/workbook.xml',data:encoder.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="'+xlsxXmlEscape(name)+'" sheetId="1" r:id="rId1"/></sheets></workbook>')},
    {name:'xl/_rels/workbook.xml.rels',data:encoder.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>')},
    {name:'xl/worksheets/sheet1.xml',data:encoder.encode(xlsxSheetXml(rows))}
  ];
  return new Blob([xlsxZip(files)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

/* ===== grade management ===== */
function createGradeManagementModel(){
  const grades=Array.from({length:12},(_,i)=>({id:'g'+(i+1),number:i+1}));
  const groups=[
    {id:'primary',name:'Primary',members:['g1','g2','g3','g4','g5']},
    {id:'middle',name:'Middle school',members:['g6','g7']},
    {id:'high',name:'High school',members:['g8','g9','g10']},
    {id:'senior',name:'Senior secondary',members:['g11','g12']}
  ];
  const subjects=[
    {id:'math',name:'Mathematics',levels:[{id:'math-foundation',tier:'Foundation'},{id:'math-intermediate',tier:'Intermediate'},{id:'math-advanced',tier:'Advanced'}]},
    {id:'phys',name:'Physics',levels:[{id:'phys-foundation',tier:'Foundation'},{id:'phys-intermediate',tier:'Intermediate'}]},
    {id:'chem',name:'Chemistry',levels:[{id:'chem-foundation',tier:'Foundation'},{id:'chem-intermediate',tier:'Intermediate'}]}
  ];
  const difficultyOptions=[{id:'easy',name:'Easy'},{id:'medium',name:'Medium'},{id:'hard',name:'Hard'},{id:'advanced',name:'Advanced'}];
  const mappingTiers=['Foundation','Intermediate','Advanced'];
  const gradeLevelMap={};
  DATA.topics.forEach(topic=>{
    gradeLevelMap[topic.id]={};
    grades.forEach((grade,gradeIndex)=>{
      const tierIndex=Math.min(mappingTiers.length-1,Math.floor(gradeIndex*mappingTiers.length/grades.length));
      gradeLevelMap[topic.id][grade.id]=[mappingTiers[tierIndex]];
    });
  });
  const levelDifficultyMap={};
  DATA.levels.forEach(level=>{
    levelDifficultyMap[level.id]=level.name==='Foundation'?['easy']:level.name==='Intermediate'?['easy','medium']:['medium','hard','advanced'];
  });
  return {grades,groups,subjects,difficultyOptions,mappingTiers,gradeLevelMap,levelDifficultyMap};
}

/* ===== dialogs + drawer ===== */
function openDialog({title,body,confirmLabel='Confirm',cancelLabel='Cancel',tone='primary',onConfirm,onCancel}){
  const root=$('#dialog-root');
  root.innerHTML='<div class="scrim" data-dialog-scrim><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title"><h2 id="dlg-title">'+esc(title)+'</h2><div class="dialog-body">'+body+'</div><div class="dialog-actions">'+(cancelLabel?'<button class="btn secondary" type="button" data-dialog="cancel">'+esc(cancelLabel)+'</button>':'')+'<button class="btn '+(tone==='danger'?'danger':'primary')+'" type="button" data-dialog="confirm">'+esc(confirmLabel)+'</button></div></div></div>';
  const dialog=root.querySelector('.dialog'); const prev=document.activeElement;
  const close=()=>{ root.innerHTML=''; if(prev&&prev.focus) prev.focus(); };
  root.querySelector('[data-dialog="confirm"]').addEventListener('click',()=>{ if(onConfirm) onConfirm(); else close(); });
  const cancelBtn=root.querySelector('[data-dialog="cancel"]'); if(cancelBtn) cancelBtn.addEventListener('click',()=>{ if(onCancel) onCancel(); close(); });
  root.querySelector('[data-dialog-scrim]').addEventListener('click',ev=>{ if(ev.target===ev.currentTarget) close(); });
  root.onkeydown=ev=>{ if(ev.key==='Escape'){ ev.stopPropagation(); if(onCancel) onCancel(); close(); } };
  root.querySelector('[data-dialog="confirm"]').focus();
  state.closeDialog=close;
  return close;
}
function closeDialog(){ if(state.closeDialog){ state.closeDialog(); state.closeDialog=null; } }
function confirmAction({title,body,confirmLabel,tone,onConfirm}){ openDialog({title,body:body,confirmLabel:confirmLabel||'Confirm',tone:tone||'danger',onConfirm:()=>{ onConfirm(); closeDialog(); }}); }

function renderAdminProfile(){
  const root=$('#profile-modal-root'); if(!root) return;
  if(!state.profileOpen){ root.hidden=true; root.innerHTML=''; document.body.style.overflow=''; return; }
  root.hidden=false;
  document.body.style.overflow='hidden';
  const view=state.profileView||'profile';
  const head=view==='edit'?['Edit Profile','Update your personal and organization details.']:view==='password'?['Change Password','Update the password for this account.']:['Admin profile','Your account details and console access.'];
  const content=view==='edit'?adminProfileEditHTML():view==='password'?adminPasswordHTML():adminProfileFieldsHTML()+adminProfileActionsHTML();
  root.innerHTML='<div class="profile-modal-backdrop" data-profile-modal-backdrop></div>'
    +'<section class="profile-modal" role="dialog" aria-modal="true" aria-labelledby="admin-profile-title">'
      +'<button class="pm-close" type="button" data-profile-modal-close aria-label="Close admin profile">'+ico('x')+'</button>'
      +'<div class="pm-head"><h2 id="admin-profile-title">'+esc(head[0])+'</h2><p>'+esc(head[1])+'</p></div>'
      +content
    +'</section>';
  root.querySelectorAll('[data-profile-modal-close],[data-profile-modal-backdrop]').forEach(el=>el.addEventListener('click',closeAdminProfile));
  const editBtn=root.querySelector('[data-profile-edit]');
  if(editBtn) editBtn.addEventListener('click',()=>{ state.profileView='edit'; state.profilePendingLogo=null; renderAdminProfile(); });
  const passBtn=root.querySelector('[data-profile-change-password]');
  if(passBtn) passBtn.addEventListener('click',()=>{ state.profileView='password'; renderAdminProfile(); });
  const logoutBtn=root.querySelector('[data-profile-logout]');
  if(logoutBtn) logoutBtn.addEventListener('click',logoutAdminProfile);
  root.querySelectorAll('[data-profile-cancel]').forEach(el=>el.addEventListener('click',()=>{ state.profilePendingLogo=null; state.profileView='profile'; renderAdminProfile(); const btn=root.querySelector('[data-profile-edit]'); if(btn) btn.focus(); }));
  const logoEdit=root.querySelector('[data-profile-logo-edit]');
  const logoInput=root.querySelector('[data-profile-logo-input]');
  if(logoEdit&&logoInput) logoEdit.addEventListener('click',()=>logoInput.click());
  if(logoInput) logoInput.addEventListener('change',ev=>{
    const file=ev.target.files&&ev.target.files[0];
    if(!file) return;
    if(!file.type||!file.type.startsWith('image/')){ toast('bad','Unsupported file','Choose an image file to use as the organization logo.'); logoInput.value=''; return; }
    const reader=new FileReader();
    reader.onload=()=>{
      if(!state.profileOpen||state.profileView!=='edit') return;
      state.profilePendingLogo=String(reader.result);
      const preview=root.querySelector('[data-profile-logo-preview]');
      if(preview) preview.innerHTML=adminLogoHTML(state.profilePendingLogo);
      const note=root.querySelector('[data-profile-logo-note]');
      if(note) note.textContent='Preview — save changes to apply.';
    };
    reader.onerror=()=>toast('bad','Logo could not be read','Choose another image and try again.');
    reader.readAsDataURL(file);
  });
  const form=root.querySelector('[data-profile-form]');
  if(form) form.addEventListener('submit',ev=>{ ev.preventDefault(); saveAdminProfile(form); });
  const passForm=root.querySelector('[data-password-form]');
  if(passForm) passForm.addEventListener('submit',ev=>{ ev.preventDefault(); saveAdminPassword(passForm); });
  const focusEl=root.querySelector(view==='edit'?'#admin-profile-name':view==='password'?'#admin-profile-current':'.pm-close');
  if(focusEl) focusEl.focus();
}
function saveAdminProfile(form){
  const nameEl=form.querySelector('[name="name"]'), emailEl=form.querySelector('[name="email"]');
  const phoneEl=form.querySelector('[name="phone"]'), designationEl=form.querySelector('[name="designation"]'), orgEl=form.querySelector('[name="organizationName"]');
  let firstInvalid=null;
  const setError=(el,msg)=>{ const field=el.closest('.field'); if(!field) return; field.classList.toggle('invalid',!!msg); const err=field.querySelector('.err'); if(err) err.textContent=msg||''; if(msg&&!firstInvalid) firstInvalid=el; };
  const name=(nameEl.value||'').trim();
  const email=(emailEl.value||'').trim();
  const org=(orgEl.value||'').trim();
  setError(nameEl,name?'':'Enter your full name.');
  setError(emailEl,email?(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)?'':'Enter a valid email address.'):'Enter your email address.');
  setError(orgEl,org?'':'Enter your organization name.');
  if(firstInvalid){ firstInvalid.focus(); return; }
  session.name=name;
  session.email=email;
  session.phone=(phoneEl.value||'').trim();
  session.designation=(designationEl.value||'').trim();
  session.organizationName=org;
  if(state.profilePendingLogo!==null) session.organizationLogo=state.profilePendingLogo;
  state.profilePendingLogo=null;
  state.profileView='profile';
  syncAdminIdentity();
  renderAdminProfile();
  toast('good','Profile updated','Your admin profile has been saved.');
}
function saveAdminPassword(form){
  const currentEl=form.querySelector('[name="currentPassword"]'), nextEl=form.querySelector('[name="newPassword"]'), confirmEl=form.querySelector('[name="confirmPassword"]');
  let firstInvalid=null;
  const setError=(el,msg)=>{ const field=el.closest('.field'); if(!field) return; field.classList.toggle('invalid',!!msg); const err=field.querySelector('.err'); if(err) err.textContent=msg||''; if(msg&&!firstInvalid) firstInvalid=el; };
  const current=(currentEl.value||'').trim();
  const next=(nextEl.value||'').trim();
  const confirm=(confirmEl.value||'').trim();
  setError(currentEl,current?'':'Enter your current password.');
  setError(nextEl,!next?'Enter a new password.':next.length<8?'Use at least 8 characters.':'');
  setError(confirmEl,!confirm?'Confirm the new password.':confirm!==next?'Passwords do not match.':'');
  if(firstInvalid){ firstInvalid.focus(); return; }
  state.profileView='profile';
  renderAdminProfile();
  toast('good','Password updated','Your password has been changed for this demo session.');
}

function applyList(key,rows,searchKeys){
  const st=listState(key); let out=rows.slice();
  const q=st.q.trim().toLowerCase();
  if(q) out=out.filter(r=>(searchKeys||['name']).some(k=>String(r[k]??'').toLowerCase().includes(q)));
  Object.entries(st.filters).forEach(([k,v])=>{ if(v) out=out.filter(r=>key==='questions'&&k==='levelId'?(String(r.levelId)===String(v)||String(byId(DATA.levels,r.levelId)?.name||'')===String(v)):String(r[k]??'')===String(v)); });
  if(st.sort){ out.sort((a,b)=>{ const x=a[st.sort],y=b[st.sort]; let r; if(typeof x==='number'&&typeof y==='number') r=x-y; else r=String(x??'').localeCompare(String(y??'')); return r*st.dir; }); }
  const total=out.length, pages=Math.max(1,Math.ceil(total/st.size));
  if(st.page>pages) st.page=pages;
  const start=(st.page-1)*st.size;
  return {rows:out.slice(start,start+st.size),total,pages,start,st};
}

function copyText(text){
  if(navigator.clipboard&&navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
  return new Promise((resolve,reject)=>{ try{ const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); resolve(); }catch(e){ reject(e); } });
}

const STUDENT_BULK_COLUMNS=[
  {key:'full_name',label:'Full Name'},
  {key:'email',label:'Email'},
  {key:'grade',label:'Grade'},
  {key:'parent_email',label:'Parent Email'}
];
const STUDENT_BULK_STEPS=['Choose File','Validation Preview','Confirm Import','Result'];
const STUDENT_BULK_MAX=500;
const STUDENT_BULK_GRADES=['Grade 7','Grade 8','Grade 9','Grade 10','Grade 11','Grade 12'];
function studentBulkState(){
  if(!state.studentBulk) resetStudentBulk();
  return state.studentBulk;
}
function resetStudentBulk(){
  const previous=state.studentBulk;
  if(previous&&previous.revalidateTimer) clearTimeout(previous.revalidateTimer);
  state.studentBulk={file:null,fileName:'',fileSize:0,step:1,progress:0,rows:[],fileErrors:[],seq:0,validated:false,dirty:false,validating:false,busy:false,error:null,result:null,successCount:0,openPicker:false,credentialsAvailable:false,generatedCredentials:null,revalidateTimer:null};
}
function studentBulkValid(){
  const st=studentBulkState();
  return st.validated&&!st.validating&&st.fileErrors.length===0&&st.rows.length>0&&st.rows.length<=STUDENT_BULK_MAX&&st.rows.every(row=>row.valid);
}
function studentBulkEmailValid(email){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(email||'').trim()); }
function studentBulkGradeValid(grade){ const value=String(grade||'').trim(); if(STUDENT_BULK_GRADES.indexOf(value)>=0) return true; return /^(7|8|9|10|11|12)$/.test(value); }
function formatFileSize(bytes){ const n=Number(bytes)||0; if(!n) return 'size unknown'; if(n<1024) return n+' B'; if(n<1024*1024) return (n/1024).toFixed(1)+' KB'; return (n/(1024*1024)).toFixed(1)+' MB'; }
function validateStudentBulkRows(rows){
  const seen={};
  rows.forEach((row,index)=>{
    if(!row.rowNumber) row.rowNumber=index+2;
    const errors={};
    const name=String(row.full_name||'').trim();
    if(!name) errors.full_name=['Full name is required.'];
    else if(name.length<2) errors.full_name=['Full name looks too short.'];
    const email=String(row.email||'').trim();
    if(!email) errors.email=['Email is required.'];
    else if(!studentBulkEmailValid(email)) errors.email=['Enter a valid email address.'];
    const grade=String(row.grade||'').trim();
    if(!grade) errors.grade=['Grade is required.'];
    else if(!studentBulkGradeValid(grade)) errors.grade=['Use a grade between 7 and 12 (for example, "Grade 9").'];
    const parent=String(row.parent_email||'').trim();
    if(parent&&!studentBulkEmailValid(parent)) errors.parent_email=['Enter a valid parent email or leave it blank.'];
    if(email&&studentBulkEmailValid(email)){
      const key=email.toLowerCase();
      if(seen[key]!==undefined) errors.email=(errors.email||[]).concat(['This email duplicates row '+seen[key]+'.']);
      else seen[key]=row.rowNumber;
    }
    row.errors=errors;
    row.valid=Object.keys(errors).length===0;
  });
  return rows;
}
function mockStudentBulkRows(){
  return validateStudentBulkRows([
    {rowNumber:2,full_name:'Maryam Al-Ansari',email:'maryam.ansari@example.com',grade:'Grade 8',parent_email:'parent.one@example.com'},
    {rowNumber:3,full_name:'Omar Al-Emadi',email:'omar.emadi@example.com',grade:'Grade 10',parent_email:''},
    {rowNumber:4,full_name:'Layla Al-Thani',email:'layla.thani@example',grade:'Grade 9',parent_email:'parent.two@example.com'},
    {rowNumber:5,full_name:'Hassan Al-Ali',email:'hassan.ali@example.com',grade:'',parent_email:''},
    {rowNumber:6,full_name:'Sara Al-Naimi',email:'omar.emadi@example.com',grade:'Grade 11',parent_email:''}
  ]);
}
function handleStudentBulkFile(file){
  const st=studentBulkState();
  if(!file) return;
  if(!/\.xlsx$/i.test(file.name)){
    st.error='Only .xlsx files are accepted. Download the template and export it as an Excel workbook.';
    st.step=1; st.validating=false; st.rows=[]; st.fileErrors=[];
    render(); toast('bad','Unsupported file','Choose an .xlsx workbook.');
    return;
  }
  st.file=file; st.fileName=file.name; st.fileSize=file.size||0; st.rows=[]; st.fileErrors=[]; st.error=null; st.successCount=0; st.result=null; st.validated=false; st.dirty=false; st.credentialsAvailable=false; st.generatedCredentials=null;
  processStudentBulkFile();
}
function processStudentBulkFile(){
  const st=studentBulkState();
  if(st.busy) return;
  st.step=1; st.progress=0; st.validating=true; st.error=null;
  render();
  const timer=setInterval(()=>{
    const current=studentBulkState();
    if(current!==st||!st.validating){ clearInterval(timer); return; }
    st.progress=Math.min(100,st.progress+10);
    const bar=document.querySelector('[data-sbulk-bar]');
    const note=document.querySelector('[data-sbulk-progress]');
    if(bar) bar.style.inlineSize=st.progress+'%';
    if(note) note.textContent=st.progress+'%';
    if(st.progress>=100){
      clearInterval(timer);
      st.rows=mockStudentBulkRows();
      st.validated=true; st.validating=false; st.dirty=false; st.step=2;
      render();
    }
  },90);
}
function scheduleStudentBulkRevalidate(){
  const st=studentBulkState();
  if(st.busy||st.step!==2) return;
  if(st.revalidateTimer) clearTimeout(st.revalidateTimer);
  st.revalidateTimer=setTimeout(()=>{ const current=studentBulkState(); if(current.dirty&&current.step===2&&!current.busy) revalidateStudentBulk(); },500);
}
function revalidateStudentBulk(){
  const st=studentBulkState();
  if(st.validating||st.busy||st.step!==2||!st.rows.length) return;
  if(st.revalidateTimer){ clearTimeout(st.revalidateTimer); st.revalidateTimer=null; }
  st.dirty=false; st.validating=true; render();
  setTimeout(()=>{
    const current=studentBulkState();
    if(current!==st||!st.validating) return;
    validateStudentBulkRows(st.rows);
    st.validated=true; st.validating=false; st.dirty=false;
    render();
  },450);
}
function studentBulkContinue(){
  const st=studentBulkState();
  if(!studentBulkValid()){ toast('bad','Invalid rows remain','Fix every invalid row before continuing.'); return; }
  st.step=3; render();
}
function studentBulkBack(){ const st=studentBulkState(); st.step=2; render(); }
function studentBulkRestart(openPicker){

}
function studentBulkUsername(existing){
  let username;
  do{ username='STU-'+Math.random().toString(36).slice(2,8).toUpperCase(); }while(existing[username]);

  return username;
}
function studentBulkPassword(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
  let out='';
  for(let i=0;i<10;i++) out+=chars[Math.floor(Math.random()*chars.length)];
  return out;
}
function confirmStudentBulkImport(){
  const st=studentBulkState();
  if(!studentBulkValid()||st.busy) return;
  st.busy=true; st.error=null; render();
  setTimeout(()=>{
    const existing={};
    DATA.students.forEach(student=>{ if(student.username) existing[student.username]=true; });
    const credentials=st.rows.map(row=>{
      const username=studentBulkUsername(existing);
      const password=studentBulkPassword();
      return {full_name:String(row.full_name||'').trim(),email:String(row.email||'').trim(),grade:String(row.grade||'').trim(),parent_email:String(row.parent_email||'').trim(),username:username,password:password};
    });

      DATA.students.unshift({id:uid('STU'),createdAt:nowISO(),username:item.username,name:item.full_name,email:item.email,grade:item.grade,parentId:null,status:'Active'});
    });
    st.generatedCredentials=credentials; st.credentialsAvailable=true;
    downloadBlob(buildLocalXlsx(studentBulkCredentialRows(credentials),'Credentials'),'student_credentials.xlsx');
    st.busy=false; st.step=4; st.result='success'; st.successCount=credentials.length; st.validated=false; st.dirty=false;
    logAudit('Created','Student','BULK-'+Date.now().toString().slice(-5),credentials.length+' student(s) created by the bulk-upload demo.');
    notify('Bulk student upload finished',credentials.length+' student(s) created. Sample credentials downloaded.','#/students');

    render();

}

/* ===== academic structure ===== */
/* ===== academic structure: one expandable tree ===== */
function treeState(){ if(!state.tree) state.tree={open:new Set(),closed:new Set(),sel:null,panel:null,questionOpen:new Set(),dirty:false,q:'',failNext:false,allowNav:false,refocus:null,qfocus:false,panelShown:null}; return state.tree; }
function nodeOpen(id){ const t=treeState(); return t.q.trim()?!t.closed.has(id):t.open.has(id); }
function treePersist(){ try{ localStorage.setItem('qiyas-admin-tree',JSON.stringify([...treeState().open])); }catch(_){} }
function treeExpand(ids){ const t=treeState(); ids.filter(Boolean).forEach(id=>t.open.add(id)); treePersist(); }
function expandToSubject(id){ treeExpand([id]); }
function expandToTopic(id){ const tp=byId(DATA.topics,id); treeExpand([tp?tp.subjectId:null,id]); }
function expandToLevel(id){ const lv=byId(DATA.levels,id); const tp=lv?byId(DATA.topics,lv.topicId):null; treeExpand([tp?tp.subjectId:null,tp?tp.id:null,id]); }
function highlightName(name,q){ if(!q) return esc(name); const i=String(name).toLowerCase().indexOf(q.toLowerCase()); if(i<0) return esc(name); return esc(name.slice(0,i))+'<mark>'+esc(name.slice(i,i+q.length))+'</mark>'+esc(name.slice(i+q.length)); }
function treeData(){
  const q=treeState().q.trim().toLowerCase();
  const groups=DATA.subjects.map(s=>({subject:s,topics:DATA.topics.filter(t=>t.subjectId===s.id).map(t=>({topic:t,levels:DATA.levels.filter(l=>l.topicId===t.id)})).sort((a,b)=>a.topic.order-b.topic.order)})).sort((a,b)=>a.subject.order-b.subject.order);
  if(!q) return groups;
  const hit=n=>String(n).toLowerCase().includes(q);
  return groups.map(g=>{
    const subjectHit=hit(g.subject.name);
    const topics=g.topics.map(x=>{
      const topicHit=hit(x.topic.name);
      const levels=x.levels.filter(l=>hit(l.name));
      return {topic:x.topic,levels:topicHit?x.levels:levels,keep:subjectHit||topicHit||levels.length>0};
    }).filter(x=>x.keep);
    return {subject:g.subject,topics:subjectHit?g.topics:topics,keep:subjectHit||topics.length>0};
  }).filter(g=>g.keep);
}
function treeMenu(kind,id){
  if(kind==='subject') return [
    {label:'Edit subject',icon:'edit',action:'edit',entity:'subject',id:id},
    {label:'Add topic',icon:'plus',action:'add-topic',entity:'subject',id:id},
    {label:'Delete subject',icon:'trash',action:'delete',entity:'subject',id:id,danger:true}
  ];
  if(kind==='topic') return [
    {label:'Edit topic',icon:'edit',action:'edit',entity:'topic',id:id},
    {label:'Add level',icon:'plus',action:'add-level',entity:'topic',id:id},
    {label:'Move up',icon:'sort',action:'move-up',entity:'topic',id:id},
    {label:'Move down',icon:'sort',action:'move-down',entity:'topic',id:id},
    {label:'Delete topic',icon:'trash',action:'delete',entity:'topic',id:id,danger:true}
  ];
  return [
    {label:'Edit level',icon:'edit',action:'edit',entity:'level',id:id},
    {label:'Delete level',icon:'trash',action:'delete',entity:'level',id:id,danger:true}
  ];
}
function treeRowHTML(kind,node,meta,q){
  const t=treeState();
  const key=kind+':'+node.id;
  const selected=t.sel===key;
  const open=kind!=='level'&&nodeOpen(node.id);
  const chev=kind==='level'?'<span class="tree-spacer" aria-hidden="true"></span>'
    :'<button class="tree-chev" type="button" tabindex="-1" data-tree-toggle="'+key+'" aria-expanded="'+open+'" aria-label="'+(open?'Collapse ':'Expand ')+esc(node.name)+'">'+ico('chev',16)+'</button>';
  const iconName=kind==='subject'?'layers':kind==='topic'?'list':'steps';
  return '<div class="tree-row" data-tree-row="'+key+'" tabindex="0"'+(selected?' aria-current="true"':'')+'>'
    +chev+'<span class="tree-ico" aria-hidden="true">'+ico(iconName,16)+'</span>'
    +'<span class="tree-name">'+(q?highlightName(node.name,q):esc(node.name))+'</span>'
    +'<span class="tree-meta">'+meta+'</span>'
    +'<span class="tree-actions"><button class="icon-btn" type="button" data-menu-toggle="tree:'+key+'" aria-haspopup="menu" aria-label="Actions for '+esc(node.name)+'">'+ico('more',16)+'</button></span>'
    +'</div>';
}
function treeEmptyChild(title,cta,href){
  return '<li class="tree-empty-row" role="none"><span>'+esc(title)+'</span><a class="btn ghost small" href="'+href+'">'+ico('plus',14)+esc(cta)+'</a></li>';
}
function treeHTML(){
  const t=treeState(); const q=t.q.trim();
  if(!DATA.subjects.length) return treeEmptyState();
  const groups=treeData();
  if(!groups.length) return '<div class="state"><h3>No matches for “'+esc(q)+'”</h3><p>Search matches subject, topic, and level names. Clear the search to see the full hierarchy again.</p><button class="btn secondary" type="button" data-action="tree-clear">Clear search</button></div>';
  const topicNode=x=>{
    const open=nodeOpen(x.topic.id);
    return '<li class="tree-node'+(t.sel==='topic:'+x.topic.id?' selected':'')+'" role="treeitem" aria-level="2" aria-expanded="'+open+'">'
      +treeRowHTML('topic',x.topic,'<span class="mono">'+x.levels.length+'</span> level'+(x.levels.length===1?'':'s'),q)
      +(open?'<ul class="tree-children" role="group">'+(x.levels.length?x.levels.sort((a,b)=>a.order-b.order).map(levelNode).join(''):treeEmptyChild('No levels yet','Add Level','#/topics/'+x.topic.id+'/levels/new'))+'</ul>':'')
      +'</li>';
  };
  const levelNode=l=>{ const n=DATA.questions.filter(x=>x.levelId===l.id).length; return '<li class="tree-node'+(t.sel==='level:'+l.id?' selected':'')+'" role="treeitem" aria-level="3">'+treeRowHTML('level',l,'<span class="mono">'+n+'</span> question'+(n===1?'':'s'),q)+'</li>'; };
  return '<ul class="tree" role="tree" aria-label="Academic structure">'+groups.map(g=>{
    const open=nodeOpen(g.subject.id);
    return '<li class="tree-node'+(t.sel==='subject:'+g.subject.id?' selected':'')+'" role="treeitem" aria-level="1" aria-expanded="'+open+'">'
      +treeRowHTML('subject',g.subject,'<span class="mono">'+g.topics.length+'</span> topic'+(g.topics.length===1?'':'s'),q)
      +(open?'<ul class="tree-children" role="group">'+(g.topics.length?g.topics.map(topicNode).join(''):treeEmptyChild('No topics yet','Add Topic','#/subjects/'+g.subject.id+'/topics/new'))+'</ul>':'')
      +'</li>';
  }).join('')+'</ul>';
}

    const open=state.gradeManagement.openGroupId===group.id;

function gradeLevelMappingScreen(){
  const mathematicsSubjectId=DATA.subjects.find(subject=>subject.name==='Mathematics')?.id;
  const mathematicsTopics=DATA.topics.filter(topic=>topic.subjectId===mathematicsSubjectId).sort((a,b)=>a.order-b.order);
  const groupOptions=GRADE_MODEL.groups.map(group=>'<option value="'+group.id+'">'+esc(group.name)+'</option>').join('');
  const subjectOptions=DATA.subjects.map(subject=>'<option value="'+subject.id+'">'+esc(subject.name)+'</option>').join('');
  const topicOptions=subjectId=>'<option value="">Select topic</option>'+DATA.topics.filter(topic=>topic.subjectId===subjectId).sort((a,b)=>a.order-b.order).map(topic=>'<option value="'+topic.id+'">'+esc(topic.name)+'</option>').join('');

    +'<div class="field"><label for="grade-bulk-group">Group</label><select id="grade-bulk-group" data-grade-bulk-group>'+groupOptions+'</select></div>'
    +'<div class="field"><label for="grade-bulk-subject">Subject</label><select id="grade-bulk-subject" data-grade-bulk-subject>'+subjectOptions+'</select></div>'
    +'<div class="field"><label for="grade-bulk-topic">Topic</label><select id="grade-bulk-topic" data-grade-bulk-topic>'+topicOptions(DATA.subjects[0]?.id)+'</select></div>'
    +'<div class="field"><label for="grade-bulk-level">Level</label><select id="grade-bulk-level" data-grade-bulk-level>'+tierOptions+'</select></div>'
    +'<button class="btn primary small" type="button" data-grade-bulk-apply>Apply to group</button></div>';
  let rows='';
  GRADE_MODEL.groups.forEach(group=>{
    rows+='<tr class="grade-group-row"><td colspan="'+(mathematicsTopics.length+1)+'">'+esc(group.name)+'</td></tr>';
    group.members.forEach(gradeId=>{
      const grade=GRADE_MODEL.grades.find(item=>item.id===gradeId);
      const cells=mathematicsTopics.map(topic=>{
        const selected=GRADE_MODEL.gradeLevelMap[topic.id][gradeId]||[];
        return '<td><div class="ms-select" data-ms-select data-grade-id="'+gradeId+'" data-topic-id="'+topic.id+'">'
          +'<button type="button" class="ms-toggle" data-ms-toggle aria-haspopup="true" aria-expanded="false"><span class="ms-value'+(selected.length?'':' is-placeholder')+'">'+(selected.length?esc(selected.join(', ')):'Select levels')+'</span>'+ico('chev',14).replace('<svg','<svg class="ms-caret"')+'</button>'
          +'<div class="ms-menu" data-ms-menu hidden>'+GRADE_MODEL.mappingTiers.map(tier=>'<label class="ms-option"><input type="checkbox" value="'+tier+'" data-ms-option'+(selected.includes(tier)?' checked':'')+'>'+esc(tier)+'</label>').join('')+'</div>'
          +'</div></td>';
      }).join('');
      rows+='<tr><td class="num">Grade '+grade.number+'</td>'+cells+'</tr>';
    });
  });
  return '<section class="grade-management panel pad"><div class="panel-head"><h2>Grade to level, by topic</h2></div><p class="grade-form-label">Bulk assign</p>'+bulk+'<div class="table-wrap grade-matrix-wrap"><table class="data grade-matrix"><caption class="sr-only">Grade to level mapping by Mathematics topic</caption><thead><tr><th scope="col">Grade</th>'+mathematicsTopics.map(topic=>'<th scope="col">'+esc(topic.name)+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div></section>';
}
function gradeDifficultyScreen(){
  const defaultSubject=DATA.subjects.find(subject=>subject.name==='Mathematics')||DATA.subjects[0];
  const selectedSubject=DATA.subjects.find(subject=>subject.id===state.gradeManagement.difficultySubjectId)||defaultSubject;
  const selectedSubjectId=selectedSubject?.id||'';
  state.gradeManagement.difficultySubjectId=selectedSubjectId;
  const subjectOptions=DATA.subjects.map(subject=>'<option value="'+subject.id+'"'+(subject.id===selectedSubjectId?' selected':'')+'>'+esc(subject.name)+'</option>').join('');
  const selectedTopics=DATA.topics.filter(topic=>topic.subjectId===selectedSubjectId).sort((a,b)=>a.order-b.order);
  const blocks=selectedTopics.map(topic=>'<section class="grade-subject-block"><h3 class="grade-subject-title">'+esc(topic.name)+'</h3>'+DATA.levels.filter(level=>level.topicId===topic.id).sort((a,b)=>a.order-b.order).map(level=>{
    const active=GRADE_MODEL.levelDifficultyMap[level.id]||[];
    const options=GRADE_MODEL.difficultyOptions.map(difficulty=>'<button class="btn secondary small grade-difficulty" type="button" data-grade-difficulty data-level-id="'+level.id+'" data-difficulty-id="'+difficulty.id+'" aria-pressed="'+active.includes(difficulty.id)+'">'+difficulty.name+'</button>').join('');
    return '<div class="grade-level-card"><span class="grade-level-name">'+esc(level.name)+'</span><div class="grade-difficulty-list">'+options+'</div></div>';

function wireTree(){
  const t=treeState();
  const panel=$('#view .editor-panel');
  if(panel&&t.panel){
    if(t.panelShown===t.panel.levelId){ panel.dataset.open='true'; }
    else requestAnimationFrame(()=>requestAnimationFrame(()=>{ panel.dataset.open='true'; t.panelShown=t.panel.levelId; }));
  } else if(!panel){ t.panelShown=null; }
  if(t.refocus){ const key=String(t.refocus); t.refocus=null; const el=$('#view [data-tree-row="'+key.replace(/"/g,'')+'"]'); if(el) el.focus(); }
  if(t.qfocus){ t.qfocus=false; const q=$('#tree-q'); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); } }
}
function toggleTreeNode(key,forceOpen){
  const t=treeState(); const parts=key.split(':'); const kind=parts[0], id=parts[1];
  if(kind==='level'){ navigate('#/levels/'+id+'/edit'); return; }
  if(t.q.trim()){
    if(forceOpen){ t.closed.delete(id); }
    else if(t.closed.has(id)){ t.closed.delete(id); }
    else { t.closed.add(id); }
  } else {
    if(t.open.has(id)&&!forceOpen) t.open.delete(id); else t.open.add(id);
  }
  t.sel=key; t.refocus=key; treePersist(); render();
}
function handleTreeRow(key){
  const t=treeState(); const parts=key.split(':'); const kind=parts[0], id=parts[1];
  t.sel=key;
  if(kind==='level'){ navigate('#/levels/'+id+'/edit'); return; }
  toggleTreeNode(key);
}

function eligibleQuestions(levelId){
  // Question Bank source of truth. Replace this filter with the Question Bank API
  // response for the level; the selection UI only depends on this returned shape.
  return DATA.questions.filter(q=>q.levelId===levelId);
}
function practiceSelectState(levelId){
  if(!state.practiceSelect[levelId]) state.practiceSelect[levelId]={q:'',difficulty:'',type:'',pool:'all',selected:new Set(practiceOf(levelId).questionIds||[])};
  return state.practiceSelect[levelId];
}
function practiceReadonlyList(pool){
  return pool.length?'<ul class="list-plain">'+pool.map(q=>'<li><span class="a-main">'+esc(q.text)+'</span><span class="a-meta">'+esc(q.id)+' · '+esc(q.difficulty)+' · '+esc(q.status)+'</span></li>').join('')+'</ul>':'<p class="muted">No eligible questions for this level yet. Add questions to this level from the Question Bank first.</p>';
}
function practiceFilteredQuestions(levelId){
  const ps=practiceSelectState(levelId); const q=ps.q.trim().toLowerCase();
  const rows=eligibleQuestions(levelId).filter(item=>{
    if(q&&!(item.text.toLowerCase().includes(q)||item.id.toLowerCase().includes(q))) return false;
    if(ps.difficulty&&item.difficulty!==ps.difficulty) return false;
    if(ps.type&&item.type!==ps.type) return false;
    return true;
  });
  return rows;
}
function practiceSelectedCount(levelId){
  const ps=practiceSelectState(levelId); const ids=new Set(eligibleQuestions(levelId).map(q=>q.id));
  return [...ps.selected].filter(id=>ids.has(id)).length;
}
function practiceListRowsHTML(levelId){

function practiceLevelRows(){
  return DATA.levels.slice().sort((a,b)=>{
    const ta=byId(DATA.topics,a.topicId), tb=byId(DATA.topics,b.topicId);
    const sa=ta?byId(DATA.subjects,ta.subjectId):null, sb=tb?byId(DATA.subjects,tb.subjectId):null;
    const so=(sa?sa.order:99)-(sb?sb.order:99);
    if(so) return so;
    const to=((ta?ta.order:99)-(tb?tb.order:99));
    if(to) return to;
    return a.order-b.order;
  });
}

const BULK_COLUMNS=[
  {key:'subject',label:'subject'},
  {key:'topic',label:'topic'},
  {key:'level',label:'level'},
  {key:'question_type',label:'question_type'},
  {key:'question',label:'question'},
  {key:'option_1',label:'option_1'},
  {key:'option_2',label:'option_2'},
  {key:'option_3',label:'option_3'},
  {key:'option_4',label:'option_4'},
  {key:'correct_answer',label:'correct_answer'},
  {key:'explanation',label:'explanation'},
  {key:'grade',label:'grade'},
  {key:'difficulty',label:'difficulty'}
];
const BULK_REQUIRED=['subject','topic','level','question_type','question','option_1','option_2','correct_answer','grade','difficulty'];
const BULK_DIFFICULTIES=['Easy','Medium','Hard','Advanced'];
function bulkDemoRows(){
  const subjects=['Math','Science','English'];
  const topics=['Algebra','Geometry','Biology','Grammar'];
  const levels=['Linear Equations','Quadratic Equations','Cells','Tenses'];
  const types=['MCQ','True/False','Short Answer'];
  const rows=[];
  for(let i=0;i<42;i++){
    rows.push({
      subject:subjects[i%subjects.length],
      topic:topics[i%topics.length],
      level:levels[i%levels.length],
      question_type:types[i%types.length],
      question:'Sample question '+(i+1)+': which option is correct?',
      option_1:'Option A '+(i+1),
      option_2:'Option B '+(i+1),
      option_3:'Option C '+(i+1),
      option_4:'Option D '+(i+1),
      correct_answer:['A','B','C','D'][i%4],
      explanation:'Explanation for question '+(i+1)+'.',
      grade:String((i%12)+1),
      difficulty:BULK_DIFFICULTIES[i%BULK_DIFFICULTIES.length]
    });
  }
  rows[6].correct_answer='E';
  rows[11].difficulty='Very hard';
  rows[18].grade='';
  rows[30].question='';
  return rows;
}
function validateBulkRow(r){
  for(const k of BULK_REQUIRED){ if(r[k]===undefined||r[k]===null||String(r[k]).trim()==='') return false; }
  if(!/^[ABCD]$/i.test(String(r.correct_answer).trim())) return false;
  if(BULK_DIFFICULTIES.indexOf(String(r.difficulty).trim())<0) return false;
  return true;
}
function bulkInvalidCells(r){
  const bad=new Set();
  for(const k of BULK_REQUIRED){ if(r[k]===undefined||r[k]===null||String(r[k]).trim()==='') bad.add(k); }
  if(!/^[ABCD]$/i.test(String(r.correct_answer).trim())) bad.add('correct_answer');
  if(BULK_DIFFICULTIES.indexOf(String(r.difficulty).trim())<0) bad.add('difficulty');
  return bad;
}
function bulkCounts(rows){
  let invalid=0;
  rows.forEach(r=>{ r.invalid=!validateBulkRow(r); if(r.invalid) invalid++; });
  return {total:rows.length,invalid:invalid,valid:rows.length-invalid};
}

    body='<div class="stack">'
      +'<div class="panel pad"><div class="panel-head"><h2>Validation preview</h2><small>Edit any cell, then validate changes</small></div>'
      +'<p class="bulk-counts" data-bulk-counts>Valid Rows: <strong>'+c.valid+'</strong> <span aria-hidden="true">|</span> <span class="bulk-counts-invalid">Invalid Rows: <strong>'+c.invalid+'</strong></span></p></div>'

    } else {

   One Exam Event → One Scheduled Exam. The Scheduled Exam is the actual
   examination; the Event is the public registration/access layer. */
function eventRegs(eventId){ return DATA.eventRegistrations.filter(r=>r.eventId===eventId); }
function eventRegCount(eventId,status){ return eventRegs(eventId).filter(r=>!status||r.status===status).length; }
function eventExam(e){ return e?byId(DATA.exams,e.examId):null; }
/* The event schedule is owned by the linked Scheduled Exam: start is its
   schedule, end is its start plus its duration. Nothing is duplicated here. */
function examSchedule(examId){
  const ex=byId(DATA.exams,examId);
  if(!ex) return {available:false,reason:'No linked scheduled exam.'};
  if(!ex.start) return {available:false,reason:'The linked scheduled exam has no start time yet.',exam:ex};
  const start=new Date(ex.start);
  const end=ex.durationMin?new Date(start.getTime()+Number(ex.durationMin)*60000):null;
  return {available:true,exam:ex,start:ex.start,end:end?end.toISOString():null,durationMin:ex.durationMin};
}
function eventSchedule(e){ return examSchedule(e?e.examId:''); }
function eventScheduleHTML(examId){
  const s=examSchedule(examId);
  if(!s.available) return '<p class="muted">'+esc(s.reason)+' Set it in Scheduled Exam Management; the event schedule is sourced from the linked exam and is not entered here.</p>';
  return '<dl class="kv">'
    +'<dt>Event start date &amp; time</dt><dd><span class="mono">'+esc(fmtDT12(s.start))+'</span></dd>'
    +'<dt>Event end date &amp; time</dt><dd>'+(s.end?'<span class="mono">'+esc(fmtDT12(s.end))+'</span>':'<span class="muted">—</span>')+'</dd>'

}

    ['Events',DATA.events.filter(e=>e.title.toLowerCase().includes(ql)||e.id.toLowerCase().includes(ql)||String(e.slug).includes(ql)).slice(0,4).map(e=>({label:e.title,meta:e.id+' · '+e.status,href:'#/events/'+e.id}))],

    ['Students',DATA.students.filter(s=>s.name.toLowerCase().includes(ql)||s.email.toLowerCase().includes(ql)||s.id.toLowerCase().includes(ql)).slice(0,4).map(s=>({label:s.name,meta:s.id+' · '+s.grade,href:'#/students/'+s.id}))],

  if(key==='students'){ const r=byId(DATA.students,id); return r?studentMenu(r):[]; }
  if(key==='tree'){ const parts=String(id).split(':'); return treeMenu(parts[0],parts.slice(1).join(':')); }
  if(key==='questions'){ const r=byId(DATA.questions,id); return r?questionMenu(r):[]; }
  if(key==='exams'){ const r=byId(DATA.exams,id); return r?examMenu(r):[]; }
  if(key==='registrants'){ const r=byId(DATA.registrants,id); return r?registrantMenu(r):[]; }
  if(key.startsWith('regs-')) { const r=byId(DATA.registrants,id); return r?registrantMenu(r):[]; }

function deleteRecord(entity,id){
  const map={parent:DATA.parents,student:DATA.students,subject:DATA.subjects,topic:DATA.topics,level:DATA.levels,question:DATA.questions,exam:DATA.exams,event:DATA.events};
  const list=map[entity]||[]; const row=byId(list,id); if(!row) return;

  confirmAction({title:'Delete '+entity+'?',body:'<p><strong>'+esc(name)+'</strong> ('+esc(id)+') will be deleted.'+esc(extra)+' This cannot be undone from the console.</p>',confirmLabel:'Delete',tone:'danger',onConfirm:()=>{

    toast('good',entity.charAt(0).toUpperCase()+entity.slice(1)+' deleted',id); render();

function moveOrder(entity,id,dir){
  const map={topic:DATA.topics,level:DATA.levels};
  const all=map[entity]; const row=byId(all,id); if(!row) return;
  const siblings=all.filter(x=>entity==='topic'?x.subjectId===row.subjectId:x.topicId===row.topicId).sort((a,b)=>a.order-b.order);
  const idx=siblings.findIndex(x=>x.id===id); const swap=siblings[idx+dir];
  if(!swap) return;
  const t=row.order; row.order=swap.order; swap.order=t;
  logAudit('Updated',entity.charAt(0).toUpperCase()+entity.slice(1),id,'Order changed to '+row.order+'.');
  toast('good','Order updated',id+' moved '+(dir<0?'up':'down')+'.'); render();
}

function applyGradeBulkAssignment(){
  const groupId=$('[data-grade-bulk-group]')?.value;
  const subjectId=$('[data-grade-bulk-subject]')?.value;
  const topicId=$('[data-grade-bulk-topic]')?.value;
  const tier=$('[data-grade-bulk-level]')?.value;
  const group=GRADE_MODEL.groups.find(item=>item.id===groupId);
  const subject=DATA.subjects.find(item=>item.id===subjectId);
  const topic=DATA.topics.find(item=>item.id===topicId&&item.subjectId===subjectId);
  if(!group||!subject||!topic||!['Foundation','Intermediate','Advanced'].includes(tier)) return;
  const topicMap=GRADE_MODEL.gradeLevelMap[topic.id]||(GRADE_MODEL.gradeLevelMap[topic.id]={});
  group.members.forEach(gradeId=>{ topicMap[gradeId]=[tier]; });
  toast('good','Bulk assignment applied',group.name+' · '+subject.name+' · '+topic.name+' · '+tier);
  render();
}
function closeAllMs(){ $$('[data-ms-menu]').forEach(menu=>{ menu.hidden=true; const toggle=menu.closest('[data-ms-select]')?.querySelector('[data-ms-toggle]'); if(toggle) toggle.setAttribute('aria-expanded','false'); }); }
function closeExamSelects(){ $$('[data-exam-options]').forEach(opts=>{ opts.hidden=true; }); $$('[data-exam-search]').forEach(input=>input.setAttribute('aria-expanded','false')); }
function updateMsLabel(wrap){
  const value=wrap.querySelector('.ms-value');
  const checked=Array.from(wrap.querySelectorAll('[data-ms-option]:checked')).map(option=>option.value);
  if(value){ value.textContent=checked.length?checked.join(', '):'Select levels'; value.classList.toggle('is-placeholder',!checked.length); }
}
function toggleGradeMember(groupId,gradeId,checked){
  const group=GRADE_MODEL.groups.find(item=>item.id===groupId); if(!group) return;
  const index=group.members.indexOf(gradeId);
  if(checked&&index===-1) group.members.push(gradeId);
  if(!checked&&index!==-1) group.members.splice(index,1);
}
function toggleGradeDifficulty(levelId,difficultyId){
  const active=GRADE_MODEL.levelDifficultyMap[levelId]||(GRADE_MODEL.levelDifficultyMap[levelId]=[]);
  const index=active.indexOf(difficultyId);
  if(index===-1) active.push(difficultyId); else active.splice(index,1);
}

/* ===== events ===== */
document.addEventListener('click',ev=>{
  const proto=ev.target.closest('[data-proto]');
  if(proto){ const kind=proto.dataset.proto; const val=proto.dataset.value;
    if(kind==='theme'){ state.theme=val; document.documentElement.dataset.theme=val; $$('[data-proto="theme"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value===val))); return; }
    if(kind==='state'){ state.viewState=val; $$('[data-proto="state"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value===val))); render(); return; }
    if(kind==='spec'){ state.specOpen=!state.specOpen; proto.setAttribute('aria-pressed',String(state.specOpen)); renderSpec(); return; }
    if(kind==='failsave'){ treeState().failNext=true; toast('bad','Next save will fail','Prototype control armed: the next editor save or publish reports a server error so the failure state is reviewable.'); return; }
     if(kind==='reset'){ confirmAction({title:'Reset demo data?',body:'<p>Every change made in this session is discarded and the seeded records return. This is a prototype control.</p>',confirmLabel:'Reset',tone:'danger',onConfirm:()=>{ DATA=SEED(); GRADE_MODEL=createGradeManagementModel(); state.list={}; state.upload=null; state.studentBulk=null; state.tree=null; state.gradeManagement={tab:'grades',openGroupId:null,difficultySubjectId:DATA.subjects.find(subject=>subject.name==='Mathematics')?.id}; treeState().failNext=false; toast('good','Demo data reset'); render(); }}); return; }
   }
  const gradeTab=ev.target.closest('[data-grade-tab]');
  if(gradeTab){ state.gradeManagement.tab=gradeTab.dataset.gradeTab; state.gradeManagement.openGroupId=null; render(); return; }
  const gradeGroupToggle=ev.target.closest('[data-grade-group-toggle]');
  if(gradeGroupToggle){ const id=gradeGroupToggle.dataset.gradeGroupToggle; state.gradeManagement.openGroupId=state.gradeManagement.openGroupId===id?null:id; render(); return; }
  if(ev.target.closest('[data-grade-group-done]')){ state.gradeManagement.openGroupId=null; render(); return; }
  const gradeBulk=ev.target.closest('[data-grade-bulk-apply]');
  if(gradeBulk){ applyGradeBulkAssignment(); return; }
  const gradeDifficulty=ev.target.closest('[data-grade-difficulty]');
  if(gradeDifficulty){ toggleGradeDifficulty(gradeDifficulty.dataset.levelId,gradeDifficulty.dataset.difficultyId); render(); return; }
  const msToggle=ev.target.closest('[data-ms-toggle]');
  if(msToggle){
    const wrap=msToggle.closest('[data-ms-select]'); const menu=wrap?.querySelector('[data-ms-menu]');
    if(menu){ const wasOpen=!menu.hidden; closeAllMs(); if(!wasOpen){ menu.hidden=false; msToggle.setAttribute('aria-expanded','true'); } }
    return;
  }
   const tab=ev.target.closest('[data-tab]');

  const bulk=ev.target.closest('[data-bulk]');

document.addEventListener('input',ev=>{
  const g=ev.target.closest('#global-search');

  const ts=ev.target.closest('[data-tree-search]');

  const bc=ev.target.closest('[data-bulk-cell]');
  if(bc){ const u=uploadState(); const row=u.rows&&u.rows[Number(bc.dataset.bulkCell)]; if(row) row[bc.dataset.bulkCol]=bc.value; return; }
  const sbc=ev.target.closest('[data-sbulk-cell]');
  if(sbc){ const st=studentBulkState(); const row=st.rows[Number(sbc.dataset.sbulkCell)]; const col=sbc.dataset.sbulkCol; if(!row) return; row[col]=sbc.value; row.dirty=true; st.dirty=true; st.validated=false; st.seq++; const cell=sbc.closest('td'); if(cell){ cell.classList.remove('bulk-cell-invalid'); sbc.removeAttribute('aria-invalid'); const err=cell.querySelector('.cell-err'); if(err) err.remove(); } return; }
  const s=ev.target.closest('[data-list-search]');
  if(!s) return;
  const key=s.dataset.listSearch; const st=listState(key); st.q=s.value; st.page=1;
  clearTimeout(state.searchTimer); state.searchTimer=setTimeout(()=>{ const v=s.value; render(); const n=$('#'+s.id); if(n){ n.focus(); n.setSelectionRange(v.length,v.length); } },220);
});

  const sbulkChange=ev.target.closest('[data-sbulk-cell]');

  const difficultySubject=ev.target.closest('[data-grade-difficulty-subject]');

  if(bulkSubject){
    const topic=$('[data-grade-bulk-topic]');
    const level=$('[data-grade-bulk-level]');
    const topics=DATA.topics.filter(item=>item.subjectId===bulkSubject.value).sort((a,b)=>a.order-b.order);
    if(topic) topic.innerHTML='<option value="">Select topic</option>'+topics.map(item=>'<option value="'+item.id+'">'+esc(item.name)+'</option>').join('');
    if(level) level.value='';

    const msOption=ev.target.closest('[data-ms-option]');
     if(msOption){

       const selected=topicMap[wrap.dataset.gradeId]||(topicMap[wrap.dataset.gradeId]=[]);

document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){
    if($('#dialog-root').innerHTML) return;
    if(state.profileOpen){ closeAdminProfile(); return; }
    closeRowMenu();
    if(state.specOpen){ state.specOpen=false; const b=$('[data-proto="spec"]'); if(b) b.setAttribute('aria-pressed','false'); renderSpec(); }
    return;
  }
  const cell=ev.target&&ev.target.closest?ev.target.closest('[data-bulk-cell]'):null;
  if(cell){
    const ri=Number(cell.dataset.bulkCell), ci=BULK_COLUMNS.findIndex(col=>col.key===cell.dataset.bulkCol);
    let nr=ri, nc=ci;
    if(ev.key==='ArrowLeft') nc=ci-1;
    else if(ev.key==='ArrowRight') nc=ci+1;
    else if(ev.key==='ArrowUp') nr=ri-1;
    else if(ev.key==='ArrowDown') nr=ri+1;
    else return;
    ev.preventDefault();
    if(nc<0||nc>=BULK_COLUMNS.length||nr<0) return;
    const next=document.querySelector('[data-bulk-cell="'+nr+'"][data-bulk-col="'+BULK_COLUMNS[nc].key+'"]');
    if(next){ next.focus(); if(typeof next.select==='function') next.select(); }
    return;
  }
  const row=ev.target&&ev.target.closest?ev.target.closest('[data-tree-row]'):null;
  if(!row) return;
  const key=row.dataset.treeRow; const parts=String(key).split(':'); const kind=parts[0], id=parts[1];
  if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); handleTreeRow(key); return; }
  if(ev.key==='ArrowRight'){ if(kind!=='level'&&!nodeOpen(id)){ ev.preventDefault(); toggleTreeNode(key,true); } return; }
  if(ev.key==='ArrowLeft'){ if(kind!=='level'&&nodeOpen(id)){ ev.preventDefault(); toggleTreeNode(key,true); } return; }
  if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){ ev.preventDefault(); const rows=$$('#view [data-tree-row]'); const i=rows.indexOf(row); const next=rows[i+(ev.key==='ArrowDown'?1:-1)]; if(next) next.focus(); return; }
});
document.addEventListener('click',ev=>{ const panel=ev.target.closest('.search-panel'); if(!panel&&!ev.target.closest('#global-search')){ const p=$('#search-panel'); if(p) p.remove(); } if(!ev.target.closest('[data-ms-select]')) closeAllMs(); if(!ev.target.closest('[data-exam-select]')) closeExamSelects(); });

function handleEntityAction(action,entity,id){
  if(action==='view'){ navigate(entityRoute(entity||'question',id)); return; }
  if(action==='edit'){ navigate(entityEditRoute(entity,id)); return; }
  if(action==='toggle'){ toggleStatus(entity,id); return; }
  if(action==='toggle-question'){ toggleStatus('question',id); return; }
  if(action==='delete'){ deleteRecord(entity,id); return; }
  if(action==='move-up'){ moveOrder(entity,id,-1); return; }
  if(action==='move-down'){ moveOrder(entity,id,1); return; }
  if(action==='link-student'){ openLinkDialog('parent',id); return; }
  if(action==='link-parent'){ openLinkDialog('student',id); return; }
  if(action==='unlink'){ const st=byId(DATA.students,id); if(!st) return; confirmAction({title:'Unlink parent?',body:'<p><strong>'+esc(st.name)+'</strong> will no longer be overseen by a parent account.</p>',confirmLabel:'Unlink',tone:'danger',onConfirm:()=>{ st.parentId=null; logAudit('Unlinked','Student',st.id,'Parent link removed.'); toast('good','Parent unlinked',st.name); render(); }}); return; }
  if(action==='practice'){ navigate('#/levels/'+id+'/practice'); return; }
  if(action==='publish-exam'){ publishExam(id); return; }
  if(action==='close-exam'){ closeExam(id); return; }
  if(action==='resend'){ resendInvite(id); return; }
  if(action==='add-topic'){ navigate('#/subjects/'+id+'/topics/new'); return; }
  if(action==='add-level'){ navigate('#/topics/'+id+'/levels/new'); return; }
  if(action==='copy-event-url'){ copyEventUrl(id); return; }
  if(action==='reg-approve'){ setEventRegStatus(id,'Approved'); return; }
  if(action==='reg-reject'){ setEventRegStatus(id,'Rejected'); return; }
  if(action==='reg-resend'){ resendEventInvite(id); return; }
  if(action==='reg-view'){ openEventRegistrantView(id); return; }
}
function boot(){
  state.navCollapsed=localStorage.getItem('qiyas-admin-nav')==='collapsed';
  document.documentElement.dataset.navCollapsed=String(state.navCollapsed);
  const btn=$('.sb-collapse');
  if(btn){ const lbl=state.navCollapsed?'Expand navigation':'Collapse navigation'; btn.setAttribute('aria-expanded',String(!state.navCollapsed)); btn.setAttribute('aria-label',lbl); btn.title=lbl; }
  const t=treeState();
  try{ const raw=localStorage.getItem('qiyas-admin-tree'); if(raw) t.open=new Set(JSON.parse(raw)); }catch(_){}
  window.addEventListener('beforeunload',ev=>{ const T=state.tree; if(T&&T.dirty){ ev.preventDefault(); ev.returnValue=''; } });
  $('#sb-nav').innerHTML=sidebarHTML();
  render();
}
boot();
